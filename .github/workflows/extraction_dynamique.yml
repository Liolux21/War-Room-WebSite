name: Super-Extracteur Dynamique 5M

# 1. Les Déclencheurs (Quand le script doit-il s'exécuter ?)
on:
  schedule:
    # Exécution automatique tous les lundis et jeudis à 4h00 UTC (soit 6h00 heure de Paris/Luxembourg)
    - cron: '0 4 * * 1,4'
  
  # L'option workflow_dispatch te permet d'ajouter un bouton sur GitHub pour forcer un tir manuel à tout moment
  workflow_dispatch: 

# 2. La Machine Virtuelle (Les opérations)
jobs:
  extraction:
    runs-on: ubuntu-latest

    steps:
      # Étape A : On clone ton dépôt sur la machine virtuelle de GitHub
      - name: 📥 Récupération du code (Checkout)
        uses: actions/checkout@v4

      # Étape B : On installe le moteur Python
      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Étape C : On charge les munitions (les bibliothèques)
      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Étape D : Lancement de l'assaut tactique
      - name: 🎯 Exécution du Super-Extracteur
        run: python extracteur_niche.py

      # Étape E : Sécurisation des données et renvoi vers ton dépôt
      - name: 💾 Commit et Push du fichier CSV
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "War Room Bot"
          # On cible spécifiquement le fichier généré
          git add MASTER_DYNAMIQUE_5M.csv
          
          # On vérifie s'il y a un changement avant de commiter pour éviter les erreurs
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Mise à jour automatique des statistiques récentes (5 derniers matchs)" && git push)
