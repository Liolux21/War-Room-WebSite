name: Super-Extracteur API Sportmonks

# 1. Les Déclencheurs (Quand l'assaut est-il lancé ?)
on:
  schedule:
    # Exécution automatique planifiée (ex: tous les lundis et jeudis à 4h00 UTC)
    - cron: '0 4 * * 1,4'
  
  # Le bouton de tir manuel pour forcer l'exécution à la demande
  workflow_dispatch: 

# 2. La Machine Virtuelle
jobs:
  extraction:
    runs-on: ubuntu-latest

    steps:
      # Étape A : On clone le code de la War Room sur le serveur
      - name: 📥 Récupération du code (Checkout)
        uses: actions/checkout@v4

      # Étape B : On installe le moteur
      - name: 🐍 Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Étape C : On charge les munitions
      - name: 📦 Installation des dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Étape D : Lancement de l'extraction API avec la clé secrète
      - name: 🎯 Exécution du script API
        env:
          # GitHub injecte la clé secrète de manière invisible ici
          SPORTMONKS_TOKEN: ${{ secrets.SPORTMONKS_TOKEN }}
        run: python api_war_room.py

      # Étape E : Sauvegarde et rapatriement des données froides
      - name: 💾 Commit et Push du fichier CSV
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "War Room API Bot"
          
          # On cible spécifiquement le nouveau fichier CSV généré par l'API
          git add MASTER_DYNAMIQUE_API_5M.csv
          
          # On vérifie s'il y a un changement avant de commiter
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 [API] Mise à jour des statistiques cliniques (5D)" && git push)
